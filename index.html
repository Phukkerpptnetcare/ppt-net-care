<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ศูนย์รับเรื่องแจ้งปัญหาอินเทอร์เน็ต - โรงเรียนพรตพิทยพยัต</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Header Section -->
  <header class="bg-blue-900 text-white shadow-lg p-5">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-xl md:text-2xl font-bold">ศูนย์รับเรื่องแจ้งปัญหาอินเทอร์เน็ต</h1>
        <p class="text-xs md:text-sm text-blue-200">PPT Net Care - โรงเรียนพรตพิทยพยัต</p>
      </div>
      <span class="bg-green-500 text-white text-xs px-3 py-1 rounded-full font-medium shadow">Online</span>
    </div>
  </header>

  <!-- Form Section -->
  <main class="max-w-2xl w-full mx-auto p-4 my-6">
    <div class="bg-white rounded-xl shadow-md p-6 border border-slate-200">
      <h2 class="text-lg font-bold text-slate-800 border-b pb-3 mb-4 flex items-center gap-2">
        <span>📝</span> แบบฟอร์มแจ้งปัญหาเครือข่ายและอินเทอร์เน็ต
      </h2>
      
      <form id="reportForm" class="space-y-4">
        <!-- Name -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อ-นามสกุล ผู้แจ้ง <span class="text-red-500">*</span></label>
          <input type="text" required placeholder="เช่น นายสมชาย ใจดี" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
        </div>

        <!-- Status & Location -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">สถานะผู้ใช้งาน <span class="text-red-500">*</span></label>
            <select class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
              <option>นักเรียน</option>
              <option>ครู / บุคลากร</option>
              <option>เจ้าหน้าที่ / อื่นๆ</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">สถานที่พบปัญหา <span class="text-red-500">*</span></label>
            <input type="text" required placeholder="เช่น อาคาร 3 ชั้น 2 / ห้องพักครู" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
          </div>
        </div>

        <!-- Issue Type -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">ประเภทปัญหา <span class="text-red-500">*</span></label>
          <select class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
            <option>เชื่อมต่อ Wi-Fi ไม่ได้</option>
            <option>อินเทอร์เน็ตช้า / สัญญาณไม่เสถียร</option>
            <option>สาย LAN ชำรุด / ไม่มีสัญญาณ LAN</option>
            <option>เข้าเว็บบางเว็บไซต์ไม่ได้</option>
            <option>อุปกรณ์เครือข่ายชำรุด (เช่น Access Point / Switch)</option>
            <option>อื่นๆ</option>
          </select>
        </div>

        <!-- Details -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">รายละเอียดปัญหาเพิ่มเติม</label>
          <textarea rows="4" placeholder="ระบุชื่อจุดเชื่อมต่อ Wi-Fi หรือลักษณะอาการเพิ่มเติม..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
          ส่งข้อมูลแจ้งปัญหา
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-800 text-slate-400 text-center py-4 text-xs">
    © 2026 PPT Net Care - Protpittayapayat School. Hosted on GitHub Pages.
  </footer>

</body>
</html>
